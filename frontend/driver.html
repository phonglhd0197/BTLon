<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tài xế – HEALTHY LIFE</title>
<style>
:root{--pri:#164525;--bg:#F9FAF4;--fg:#191C19;--card:#fff;--line:#C1C9BE;--ok:#1E6B38;--bad:#BA1A1A;--mute:#5a625a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--pri:#A0D3A7;--bg:#111411;--fg:#E2E3DE;--card:#1E201D;--line:#414941;--ok:#7FD39A;--bad:#FFB4AB;--mute:#a9b1a7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Be Vietnam Pro",sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 18px;background:var(--pri);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.5}
.mute{color:var(--mute);font-size:14px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--line);font-size:12px;font-weight:600}
a{color:var(--pri)}
</style>
</head>
<body>
<h1>🛵 Tài xế HEALTHY LIFE</h1>
<p class="mute">Trang này gửi vị trí GPS của điện thoại về cửa hàng để quản trị theo dõi xe theo thời gian thực. Hãy giữ màn hình sáng và không đóng trang khi đang giao.</p>
<div class="card" id="login">
  <label for="tok" class="mute">Mã thiết bị của xe (do quản trị cấp)</label>
  <input id="tok" type="password" autocomplete="off" placeholder="hlv_…">
  <p class="row"><button id="save">Đăng nhập xe</button></p>
</div>
<div class="card" id="main" hidden>
  <div class="row"><b id="who"></b><button class="alt" id="out" style="margin-left:auto;padding:6px 12px">Đổi xe</button></div>
  <p id="gps" class="mute">Chưa chia sẻ vị trí</p>
  <p class="row"><button id="go">Bắt đầu chia sẻ vị trí</button></p>
</div>
<div id="orders"></div>
<p id="err" class="bad" role="alert"></p>
<script src="js/driver.js"></script>
</body>
</html>
